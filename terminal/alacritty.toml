# ==========================================
#  ALACRITTY MINIMALIST CONFIGURATION
# ==========================================

# --- General Settings ---

# --- Typography ---
[font]
size = 12.5

[font.normal]
family = "Fira Code"
style = "Medium"


[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"


# --- Window Layout & Spacing ---
[window]
decorations = "None"      # Hides the title bar for a minimal look
opacity = 0.85            # Matches your 0.85 opacity
blur = true               # Enables blur (supported on macOS and some Linux compositors)
startup_mode = "Windowed"

[window.dimensions]
columns = 120
lines = 35

[window.padding]
x = 16
y = 16


# --- Static Cursor Aesthetics ---
[cursor]
blink_interval = 500      # Milliseconds (matches 0.5s blinking)

[cursor.style]
shape = "Underline"       # Matches your 'underline' choice
blinking = "On"           # Enables cursor blinking


# --- Terminal Performance & Mouse ---
[mouse]
hide_when_typing = true


# --- Aesthetic "Tokyo Night" Minimal Color Palette ---
[colors.primary]
background = "#000000"    # Pure black background
foreground = "#ffffff"    # Crisp white text

[colors.cursor]
text = "#1a1b26"
cursor = "#e0af68"

[colors.normal]
black   = "#414868"
red     = "#f7768e"
green   = "#73daca"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#73daca"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"
