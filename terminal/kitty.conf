# ==========================================
#  KITTY MINIMALIST CONFIGURATION
# ==========================================

# --- Typography ---
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# Fine-tune font rendering
adjust_line_height  110%
disable_ligatures   never

# --- Window Layout & Spacing ---
window_padding_width    3
placement_strategy      center
hide_window_decorations no
remember_window_size    no
initial_width           1000
initial_height          650

# --- Sleek Translucency ---
background_opacity         0.85
background_blur            20
dynamic_background_opacity yes

# --- Smooth Cursor Aesthetics ---
cursor                  #e0af68
cursor_text_color       #1a1b26
cursor_shape            underline
cursor_beam_thickness   1.5
cursor_blink_interval   0.5
cursor_trail            0
cursor_trail_decay      0.1 0.4

# --- Modern Tab Bar (Island Style) ---
tab_bar_edge            top
tab_bar_margin_width    6
tab_bar_margin_height   6 0
tab_bar_style           fade
tab_fade                0.25 0.5 0.75 1
active_tab_font_style   bold
inactive_tab_font_style normal

# --- Performance & Mouse ---
copy_on_select           yes
terminal_select_modifiers ctrl
mouse_hide_wait          2.0
focus_follows_mouse      no
repaint_delay            10
input_delay              3
sync_to_monitor          yes

# --- Aesthetic "Tokyo Night" Minimal Color Palette ---
background #000000
foreground #ffffff

# Black
color0 #414868
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2 #73daca
color10 #73daca

# Yellow
color3 #e0af68
color11 #e0af68

# Blue
color4 #7aa2f7
color12 #7aa2f7

# Magenta
color5 #bb9af7
color13 #bb9af7

# Cyan
color6 #7dcfff
color14 #7dcfff

# White
color7 #c0caf5
color15 #c0caf5

# Tab Colors
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #787c99
inactive_tab_background #16161e

# --- Advanced Keys ---
# Reload configuration instantly without restarting Kitty
map ctrl+shift+f5 load_config_file
