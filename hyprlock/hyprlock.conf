general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 5
    blur_size = 2
    brightness = 0.4
    contrast = 1.2
}

# Time (center, clean white text)
label {
    monitor =
    text = $TIME
    font_size = 80
    color = rgba(255, 255, 255, 0.95)
    position = 0, 120
    halign = center
    valign = center
}

# Date (smaller gray text)
# Username
label {
    monitor =
    text = $USER
    font_size = 28
    color = rgba(220, 220, 220, 0.85)
    position = 0, 200
    halign = center
    valign = center
}

# Password input (minimal, centered box)
input-field {
    monitor =
    size = 280, 40
    position = 0, -120
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(20, 20, 20, 0.6)

    font_color = rgba(255, 255, 255, 0.9)

    dots_color = rgba(255, 255, 255, 0.9)
    dots_spacing = 0.25

    fade_on_empty = false
    placeholder_text = "••••••••"
}
